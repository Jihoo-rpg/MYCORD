<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mycord</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#13201f; --panel:#192a28; --raise:#213633; --line:#2b4441; --hover:#24403c;
  --text:#e8efe9; --muted:#93a8a4; --accent:#ffb547; --accent-ink:#2a1a00;
  --mint:#7fd6a8; --danger:#ff7a6b;
  --display:"Do Hyeon","Apple SD Gothic Neo",sans-serif;
  --font:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);overflow:hidden;user-select:none}
input,textarea,button{font:inherit;color:inherit}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.btn{border:0;border-radius:999px;padding:9px 18px;background:var(--raise);cursor:pointer;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.mint{background:var(--mint);color:#0b2a1c}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.small{padding:6px 13px;font-size:13px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
input,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;width:100%;outline:none}
input:focus{border-color:var(--accent)}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:16px 0 6px}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:8px}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--muted);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.av{border-radius:32%;flex:none;display:grid;place-items:center;font-weight:700;color:#14201e}

.center-screen{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;text-align:center;padding:24px}
.center-screen h1{font:400 44px/1.1 var(--display);margin-bottom:10px}
.center-screen code{background:var(--raise);padding:2px 6px;border-radius:6px}

/* 로그인 */
.auth{position:fixed;inset:0;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg)}
.auth-art{background:var(--panel);display:flex;flex-direction:column;justify-content:center;padding:64px;gap:14px;overflow:hidden}
.auth-art .word{font:400 76px/1 var(--display);color:var(--accent);letter-spacing:-1px}
.auth-art .b{max-width:300px;padding:11px 16px;border-radius:20px 20px 20px 6px;background:var(--raise)}
.auth-art .b.me{align-self:flex-end;border-radius:20px 20px 6px 20px;background:var(--accent);color:var(--accent-ink);margin-right:40px}
.auth-form{display:grid;place-items:center;padding:32px}
.auth-card{width:360px}
.auth-card h1{font:400 34px/1.15 var(--display);margin-bottom:4px}
.auth-card .btn{margin-top:22px;padding:13px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:10px}
.switch{margin-top:16px;font-size:14px;color:var(--muted)}
.switch a{color:var(--accent);cursor:pointer;font-weight:700}

/* 상단 탭 */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{height:60px;display:flex;align-items:center;gap:16px;padding:0 14px 0 20px;border-bottom:1px solid var(--line);flex:none}
.logo{font:400 26px/1 var(--display);color:var(--accent);flex:none}
.tabs{flex:1;display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap;flex:none}
.tab:hover{background:var(--panel);color:var(--text)}
.tab.on{background:var(--raise);color:var(--text)}
.tab-dot{width:9px;height:9px;border-radius:3px}
.tab.add{color:var(--accent);border:1.5px dashed var(--line)}
.badge{background:var(--danger);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.me-btn{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;padding:5px 10px 5px 5px;border-radius:14px;max-width:220px}
.me-btn:hover{background:var(--panel)}
.me-btn b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:fixed;top:56px;right:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:190px;z-index:30;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer}
.menu button:hover{background:var(--hover)}
.menu .code-line{padding:8px 12px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px}

/* 본문 */
.body{flex:1;display:flex;min-height:0}
.side{width:250px;background:var(--panel);display:flex;flex-direction:column;margin:12px 0 12px 12px;border-radius:18px;overflow:hidden;flex:none}
.side-head{padding:18px 16px 8px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.side-title{font:400 22px/1.2 var(--display);word-break:keep-all}
.side-list{flex:1;overflow-y:auto;padding:4px 10px 14px}
.side-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);padding:14px 8px 6px}
.ch-item,.dm-item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:12px;color:var(--muted);cursor:pointer;margin-bottom:2px;overflow:hidden;white-space:nowrap}
.ch-item:hover,.dm-item:hover{background:var(--hover);color:var(--text)}
.ch-item.on,.dm-item.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.ch-item.on .ch-dot{background:var(--accent-ink)}
.ch-dot{width:7px;height:7px;border-radius:50%;background:var(--line);flex:none}
.ch-item.danger{color:var(--danger);margin-top:14px;font-size:13px}
.dm-item span{overflow:hidden;text-overflow:ellipsis}
.pill{margin-left:auto}
.empty-small{color:var(--muted);font-size:13px;padding:8px 10px}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.main-head{padding:18px 28px 10px;display:flex;align-items:center;gap:12px;flex:none}
.main-head h2{font:400 26px/1.1 var(--display)}
.main-head .sub{color:var(--muted);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.main-body{flex:1;overflow:hidden;display:flex;flex-direction:column}
.empty-main{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}

/* 말풍선 */
.messages{flex:1;overflow-y:auto;padding:8px 28px 12px;user-select:text;display:flex;flex-direction:column}
.welcome{margin:auto 0 18px;padding-top:20px;text-align:center;color:var(--muted)}
.welcome .av{margin:0 auto 12px}
.welcome h3{font:400 24px/1.2 var(--display);color:var(--text);margin-bottom:4px}
.day{align-self:center;background:var(--panel);color:var(--muted);font-size:12px;padding:4px 12px;border-radius:999px;margin:18px 0 8px}
.m{display:flex;align-items:flex-end;gap:8px;margin-top:3px;max-width:72%}
.m.first{margin-top:14px}
.m.mine{align-self:flex-end;flex-direction:row-reverse}
.m .av-slot{width:34px;flex:none;align-self:flex-start}
.m-col{display:flex;flex-direction:column;min-width:0}
.m-name{font-size:13px;font-weight:700;margin:0 0 4px 4px}
.bubble{background:var(--raise);padding:9px 14px;border-radius:18px;white-space:pre-wrap;word-break:break-word;max-width:100%}
.m.other.first .bubble{border-top-left-radius:6px}
.m.mine .bubble{background:var(--accent);color:var(--accent-ink)}
.m.mine.first .bubble{border-top-right-radius:6px}
.bubble a{color:inherit;text-decoration:underline}
.m time{font-size:11px;color:var(--muted);white-space:nowrap;flex:none}

.composer{padding:6px 28px 22px;flex:none}
.composer-box{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:22px;padding:6px 6px 6px 18px}
.composer-box:focus-within{border-color:var(--accent)}
.composer textarea{background:none;border:0;padding:8px 0;resize:none;max-height:200px;display:block;outline:none}
.send{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;flex:none}

/* 친구 */
.friends{overflow-y:auto;padding:4px 28px 28px;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
.card{background:var(--panel);border-radius:18px;padding:20px}
.card.wide{grid-column:1/-1}
.card h3{font:400 20px/1.2 var(--display);margin-bottom:12px}
.code{font:400 24px/1 var(--display);letter-spacing:4px;color:var(--accent);user-select:text}
.friend-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.friend-row:first-of-type{border-top:0}
.fr-info{flex:1;min-width:0;line-height:1.35}
.fr-info b,.fr-info span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-info span{font-size:13px}

/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(5,12,11,.72);display:grid;place-items:center;z-index:40}
.modal{width:460px;max-width:92vw;max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:22px;padding:26px}
.modal h2{font:400 28px/1.15 var(--display);margin-bottom:6px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.or{text-align:center;color:var(--muted);font-size:13px;margin:20px 0 0}
.invite-box{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:14px;padding:14px 16px;margin-top:16px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:32px;height:32px;border-radius:32%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--text)}
.profile-preview{display:flex;justify-content:center;margin:16px 0 4px}

.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);font-weight:500;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-art{display:none}.friends{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="loading" class="center-screen"><div><h1>Mycord</h1><p class="muted">불러오는 중…</p></div></div>
<div id="setup" class="center-screen hidden"><div>
  <h1>Firebase 설정이 필요해요</h1>
  <p class="muted">app.html 안의 <code>firebaseConfig</code> 자리에 Firebase 콘솔에서 복사한 설정을 붙여넣고 다시 실행하세요.</p>
</div></div>

<div id="auth" class="auth hidden">
  <div class="auth-art" aria-hidden="true">
    <div class="word">Mycord</div>
    <div class="b">오늘 저녁에 다들 접속해?</div>
    <div class="b me">나 지금 들어왔어!</div>
    <div class="b">초대 코드 보낼게 잠깐만</div>
  </div>
  <div class="auth-form">
    <div class="auth-card">
      <h1 id="authTitle">다시 왔네요</h1>
      <p class="muted" id="authSub">아이디로 로그인하세요.</p>
      <label for="authEmail">아이디</label>
      <input id="authEmail" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="영어 소문자, 숫자, _ (3~20자)">
      <label for="authPw">비밀번호</label>
      <input id="authPw" type="password" autocomplete="current-password">
      <div id="authErr" class="err"></div>
      <button id="authBtn" class="btn primary full">로그인</button>
      <p class="switch"><span id="authSwitchText">처음이에요?</span> <a id="authSwitch">가입하기</a></p>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="logo">Mycord</div>
    <nav class="tabs" id="tabs" aria-label="서버"></nav>
    <button class="me-btn" id="meBtn" aria-label="내 메뉴"><span id="meAv"></span><b id="meName"></b></button>
  </header>
  <div class="body">
    <aside class="side">
      <div class="side-head" id="sideHead"></div>
      <div class="side-list" id="sideList"></div>
    </aside>
    <main class="main">
      <header class="main-head" id="mainHead"></header>
      <div class="main-body" id="mainBody"></div>
      <div class="composer hidden" id="composer">
        <div class="composer-box">
          <textarea id="msgInput" rows="1" aria-label="메시지"></textarea>
          <button class="send" id="sendBtn" aria-label="보내기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="menu" class="menu hidden"></div>
<div id="modalBg" class="modal-bg hidden"><div class="modal" id="modal"></div></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   여기에 Firebase 콘솔에서 복사한 설정을 통째로 붙여넣으세요
   ============================================================ */
const firebaseConfig = {
  // apiKey: "...",
  // authDomain: "...",
  // projectId: "...",
  // storageBucket: "...",
  // messagingSenderId: "...",
  // appId: "..."
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\/[^\s'"()<>\\]+$/.test(u || '') ? u : '';
const safeColor = c => /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#ffb547';
const COLORS = ['#ffb547','#7fd6a8','#8ec5ff','#ff9f8a','#f5d76e','#c6a7ff','#6fd3d6','#ffa8c9','#b8e07a','#d4c4a8'];
const rand = n => { const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < n; i++) s += ch[Math.floor(Math.random() * ch.length)]; return s; };
const hashColor = id => COLORS[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('show'), 2400);
}

if (!firebaseConfig.apiKey) {
  $('loading').classList.add('hidden');
  $('setup').classList.remove('hidden');
  throw new Error('firebaseConfig가 비어 있어요');
}

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const FV = firebase.firestore.FieldValue;
const TS = () => FV.serverTimestamp();

/* ---------- 상태 ---------- */
let me = null, myProfile = null;
let servers = [], channels = [], dms = [], requests = [], msgs = [];
let state = { view: 'friends', serverId: null, channelId: null, dmId: null };
let globalUnsubs = [], chanUnsub = null, msgUnsub = null, msgRef = null, forceScroll = false;
const users = {}, loadingUsers = {};

function getUser(uid) {
  if (users[uid]) return users[uid];
  if (!loadingUsers[uid]) {
    loadingUsers[uid] = db.collection('users').doc(uid).get().then(d => {
      users[uid] = d.exists ? d.data() : { nickname: '알 수 없는 사용자', color: '#93a8a4' };
      rerenderSoon();
    }).catch(() => {});
  }
  return { nickname: '…', color: '#2b4441' };
}
let rerenderTimer = null;
function rerenderSoon() {
  clearTimeout(rerenderTimer);
  rerenderTimer = setTimeout(() => {
    renderSide();
    if (state.view === 'friends') renderFriends();
    else { renderMessages(); if (state.view === 'dm') renderDMHead(); }
  }, 30);
}

function av(p, size = 40) {
  const u = safeUrl(p && p.photoURL);
  const ini = esc(((p && p.nickname) || '?').slice(0, 1).toUpperCase());
  const bg = u ? `url('${u}') center/cover` : safeColor(p && p.color);
  return `<div class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .44)}px;background:${bg}">${u ? '' : ini}</div>`;
}
const fmtTime = d => d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
function fmtDay(d) {
  const today = new Date(); const y = new Date(); y.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return '오늘';
  if (d.toDateString() === y.toDateString()) return '어제';
  return d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
}
const fmtText = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');

/* ---------- 1. 회원가입 / 로그인 ---------- */
let signupMode = false;
const ID_DOMAIN = '@mycord.app'; // 아이디를 Firebase 로그인용 주소로 바꿔줘요
const idOf = email => String(email || '').replace(ID_DOMAIN, '');
function setAuthMode(on) {
  signupMode = on;
  $('authTitle').textContent = on ? '반가워요, 처음이죠?' : '다시 왔네요';
  $('authSub').textContent = on ? '아이디와 비밀번호(6자 이상)를 정해서 가입하세요.' : '아이디로 로그인하세요.';
  $('authBtn').textContent = on ? '가입하기' : '로그인';
  $('authSwitchText').textContent = on ? '이미 계정이 있나요?' : '처음이에요?';
  $('authSwitch').textContent = on ? '로그인' : '가입하기';
  $('authErr').textContent = '';
}
$('authSwitch').onclick = () => setAuthMode(!signupMode);
const AUTH_ERRORS = {
  'auth/invalid-email': '아이디는 영어 소문자, 숫자, _로 3~20자여야 해요.',
  'auth/email-already-in-use': '이미 있는 아이디예요. 다른 아이디를 쓰거나 로그인하세요.',
  'auth/configuration-not-found': 'Firebase 콘솔 → Authentication에서 시작하기를 누르고 이메일/비밀번호를 켜주세요.',
  'auth/weak-password': '비밀번호는 6자 이상이어야 해요.',
  'auth/invalid-credential': '아이디 또는 비밀번호가 틀렸어요.',
  'auth/wrong-password': '아이디 또는 비밀번호가 틀렸어요.',
  'auth/user-not-found': '없는 아이디예요. 가입하기를 눌러주세요.',
  'auth/too-many-requests': '시도가 너무 많아요. 잠시 후 다시 해주세요.',
  'auth/network-request-failed': '인터넷 연결을 확인하세요.',
  'auth/operation-not-allowed': 'Firebase 콘솔 → Authentication에서 이메일/비밀번호 로그인을 켜주세요.'
};
async function doAuth() {
  const id = $('authEmail').value.trim().toLowerCase(), pw = $('authPw').value;
  if (!id || !pw) { $('authErr').textContent = '아이디와 비밀번호를 입력하세요.'; return; }
  if (!/^[a-z0-9_]{3,20}$/.test(id)) { $('authErr').textContent = AUTH_ERRORS['auth/invalid-email']; return; }
  const email = id + ID_DOMAIN;
  $('authBtn').disabled = true; $('authErr').textContent = '';
  try {
    if (signupMode) await auth.createUserWithEmailAndPassword(email, pw);
    else await auth.signInWithEmailAndPassword(email, pw);
  } catch (e) { $('authErr').textContent = AUTH_ERRORS[e.code] || e.message; }
  $('authBtn').disabled = false;
}
$('authBtn').onclick = doAuth;
$('authPw').onkeydown = e => { if (e.key === 'Enter') doAuth(); };

auth.onAuthStateChanged(async user => {
  globalUnsubs.forEach(f => f()); globalUnsubs = [];
  stopView();
  $('loading').classList.add('hidden');
  if (!user) {
    me = null; myProfile = null;
    $('app').classList.add('hidden'); $('auth').classList.remove('hidden');
    return;
  }
  me = user;
  const ref = db.collection('users').doc(user.uid);
  try {
    const snap = await ref.get();
    if (!snap.exists) {
      await ref.set({
        username: idOf(user.email),
        nickname: idOf(user.email).slice(0, 20),
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        status: '', photoURL: '', friendCode: rand(6), friends: [],
        createdAt: TS()
      });
    }
  } catch (e) { toast('Firestore에 연결하지 못했어요: ' + e.message); return; }
  $('auth').classList.add('hidden'); $('app').classList.remove('hidden');

  globalUnsubs.push(ref.onSnapshot(d => {
    myProfile = d.data(); if (!myProfile) return;
    users[me.uid] = myProfile; renderMe();
    if (state.view === 'friends') renderFriends();
  }));
  globalUnsubs.push(db.collection('servers').where('members', 'array-contains', me.uid).onSnapshot(s => {
    servers = s.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
    renderTabs();
    if (state.view === 'server') { if (!curServer()) openFriends(); else renderSide(); }
  }));
  globalUnsubs.push(db.collection('dms').where('members', 'array-contains', me.uid).onSnapshot(s => {
    dms = s.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.lastAt?.toMillis?.() || 0) - (a.lastAt?.toMillis?.() || 0));
    if (state.view !== 'server') renderSide();
  }));
  globalUnsubs.push(db.collection('friendRequests').where('to', '==', me.uid).onSnapshot(s => {
    requests = s.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTabs(); if (state.view !== 'server') renderSide();
    if (state.view === 'friends') renderFriends();
  }));
  openFriends();
});

/* ---------- 화면 틀 ---------- */
const curServer = () => servers.find(s => s.id === state.serverId);
function stopView() {
  if (chanUnsub) chanUnsub(); if (msgUnsub) msgUnsub();
  chanUnsub = msgUnsub = null; msgRef = null; msgs = [];
}
function renderMe() {
  $('meAv').innerHTML = av(myProfile, 34);
  $('meName').textContent = myProfile.nickname;
}
$('meBtn').onclick = e => {
  e.stopPropagation();
  const m = $('menu');
  if (!m.classList.contains('hidden')) return m.classList.add('hidden');
  m.innerHTML = `<div class="code-line">${esc(myProfile.status || '상태 메시지 없음')}<br>친구 코드 <b>${esc(myProfile.friendCode)}</b></div>
    <button data-m="profile">프로필 편집</button><button data-m="copy">친구 코드 복사</button><button data-m="logout">로그아웃</button>`;
  m.classList.remove('hidden');
};
$('menu').onclick = e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  $('menu').classList.add('hidden');
  if (b.dataset.m === 'profile') profileModal();
  if (b.dataset.m === 'copy') { navigator.clipboard.writeText(myProfile.friendCode); toast('친구 코드를 복사했어요'); }
  if (b.dataset.m === 'logout' && confirm('로그아웃할까요?')) auth.signOut();
};
document.addEventListener('click', e => { if (!e.target.closest('#menu')) $('menu').classList.add('hidden'); });

function renderTabs() {
  const home = state.view !== 'server';
  $('tabs').innerHTML =
    `<button class="tab ${home ? 'on' : ''}" data-home>홈${requests.length ? `<span class="badge">${requests.length}</span>` : ''}</button>` +
    servers.map(s => `<button class="tab ${!home && s.id === state.serverId ? 'on' : ''}" data-sid="${s.id}"><span class="tab-dot" style="background:${hashColor(s.id)}"></span>${esc(s.name)}</button>`).join('') +
    `<button class="tab add" data-add>+ 서버</button>`;
}
$('tabs').onclick = e => {
  const t = e.target.closest('.tab'); if (!t) return;
  if (t.dataset.home !== undefined) openFriends();
  else if (t.dataset.add !== undefined) addServerModal();
  else if (t.dataset.sid) openServer(t.dataset.sid);
};

function renderSide() {
  if (!me) return;
  if (state.view === 'server') {
    const sv = curServer(); if (!sv) return;
    const owner = sv.ownerId === me.uid;
    $('sideHead').innerHTML = `<div class="side-title">${esc(sv.name)}</div>
      <button class="icon-btn" data-invite title="친구 초대" aria-label="친구 초대"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg></button>`;
    $('sideList').innerHTML =
      `<div class="side-label">채널 ${owner ? '<button class="icon-btn" data-addch title="채널 만들기" aria-label="채널 만들기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>' : ''}</div>` +
      channels.map(c => `<button class="ch-item ${c.id === state.channelId ? 'on' : ''}" data-ch="${c.id}"><span class="ch-dot"></span>${esc(c.name)}</button>`).join('') +
      (owner ? `<button class="ch-item danger" data-delserver>서버 삭제하기</button>` : `<button class="ch-item danger" data-leave>서버 나가기</button>`);
  } else {
    $('sideHead').innerHTML = `<div class="side-title">홈</div>`;
    $('sideList').innerHTML =
      `<button class="ch-item ${state.view === 'friends' ? 'on' : ''}" data-friends><span class="ch-dot"></span>친구${requests.length ? `<span class="badge pill">${requests.length}</span>` : ''}</button>
       <div class="side-label">대화</div>` +
      (dms.length ? dms.map(d => {
        const other = d.members.find(u => u !== me.uid) || me.uid; const p = getUser(other);
        return `<button class="dm-item ${d.id === state.dmId ? 'on' : ''}" data-dm="${d.id}">${av(p, 30)}<span>${esc(p.nickname)}</span></button>`;
      }).join('') : `<div class="empty-small">친구 화면에서 대화하기를 누르면 여기에 생겨요.</div>`);
  }
}
$('sideHead').onclick = e => { if (e.target.closest('[data-invite]')) inviteModal(); };
$('sideList').onclick = e => {
  const t = e.target.closest('[data-ch],[data-dm],[data-friends],[data-addch],[data-leave],[data-delserver]'); if (!t) return;
  const d = t.dataset;
  if (d.addch !== undefined) channelModal();
  else if (d.ch) openChannel(d.ch);
  else if (d.dm) openDM(d.dm);
  else if (d.friends !== undefined) openFriends();
  else if (d.leave !== undefined) leaveServer();
  else if (d.delserver !== undefined) deleteServer();
};
function showComposer(placeholder) {
  $('composer').classList.toggle('hidden', !placeholder);
  if (placeholder) { $('msgInput').placeholder = placeholder; $('msgInput').focus(); }
}

/* ---------- 3. 서버 ---------- */
function openServer(sid) {
  stopView();
  state = { view: 'server', serverId: sid, channelId: null, dmId: null };
  channels = []; renderTabs(); renderSide();
  $('mainHead').innerHTML = ''; $('mainBody').innerHTML = ''; showComposer(null);
  chanUnsub = db.collection('servers').doc(sid).collection('channels').orderBy('createdAt').onSnapshot(s => {
    if (state.serverId !== sid) return;
    channels = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!channels.find(c => c.id === state.channelId)) {
      if (channels[0]) openChannel(channels[0].id);
      else { $('mainBody').innerHTML = `<div class="empty-main">채널이 없어요. 왼쪽 + 버튼으로 채널을 만드세요.</div>`; showComposer(null); }
    }
    renderSide();
  }, err => toast('채널을 불러오지 못했어요: ' + err.message));
}
function addServerModal() {
  modal(`<h2>서버 추가</h2><p class="muted">새 서버를 만들거나 친구에게 받은 초대 코드로 들어가세요.</p>
    <label for="newServerName">새 서버 이름</label>
    <div class="row"><input id="newServerName" maxlength="40" placeholder="${esc(myProfile.nickname)}의 서버"><button class="btn primary" id="createServerBtn">만들기</button></div>
    <p class="or">또는</p>
    <label for="joinCode">초대 코드</label>
    <div class="row"><input id="joinCode" maxlength="6" placeholder="6자리 코드"><button class="btn mint" id="joinServerBtn">들어가기</button></div>
    <div class="modal-foot"><button class="btn ghost" data-close>닫기</button></div>`);
  $('createServerBtn').onclick = createServer;
  $('joinServerBtn').onclick = joinServer;
  $('joinCode').onkeydown = e => { if (e.key === 'Enter') joinServer(); };
  $('newServerName').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) createServer(); };
}
async function createServer() {
  const name = ($('newServerName').value.trim() || `${myProfile.nickname}의 서버`).slice(0, 40);
  try {
    const ref = db.collection('servers').doc();
    await ref.set({ name, ownerId: me.uid, members: [me.uid], inviteCode: rand(6), createdAt: TS() });
    await ref.collection('channels').add({ name: '일반', createdAt: TS() });
    closeModal(); openServer(ref.id); toast('서버를 만들었어요');
  } catch (e) { toast('서버를 만들지 못했어요: ' + e.message); }
}
async function joinServer() {
  const code = $('joinCode').value.trim().toUpperCase();
  if (code.length !== 6) return toast('초대 코드는 6자리예요');
  try {
    const q = await db.collection('servers').where('inviteCode', '==', code).limit(1).get();
    if (q.empty) return toast('이 코드의 서버를 찾을 수 없어요');
    const d = q.docs[0];
    if (!d.data().members.includes(me.uid)) await d.ref.update({ members: FV.arrayUnion(me.uid) });
    closeModal(); openServer(d.id); toast(`${d.data().name}에 들어왔어요`);
  } catch (e) { toast('들어가지 못했어요: ' + e.message); }
}
function inviteModal() {
  const sv = curServer(); if (!sv) return;
  modal(`<h2>친구 초대</h2><p class="muted">이 코드를 친구에게 보내주세요. 친구는 위쪽 + 서버 → 초대 코드로 들어올 수 있어요.</p>
    <div class="invite-box"><span class="code">${esc(sv.inviteCode)}</span><button class="btn primary small" id="copyInvite">복사</button></div>
    <div class="modal-foot"><button class="btn ghost" data-close>닫기</button></div>`);
  $('copyInvite').onclick = () => { navigator.clipboard.writeText(sv.inviteCode); toast('초대 코드를 복사했어요'); };
}
async function leaveServer() {
  const sv = curServer(); if (!sv || !confirm(`${sv.name}에서 나갈까요?`)) return;
  await db.collection('servers').doc(sv.id).update({ members: FV.arrayRemove(me.uid) });
  openFriends();
}
async function deleteServer() {
  const sv = curServer(); if (!sv || !confirm(`${sv.name} 서버를 삭제할까요? 되돌릴 수 없어요.`)) return;
  const id = sv.id; openFriends();
  await db.collection('servers').doc(id).delete();
  toast('서버를 삭제했어요');
}

/* ---------- 4. 텍스트 채널 ---------- */
function channelModal() {
  modal(`<h2>채널 만들기</h2><p class="muted">${esc(curServer().name)}에 새 채널을 추가해요.</p>
    <label for="chName">채널 이름</label><input id="chName" maxlength="30" placeholder="예: 잡담">
    <div class="modal-foot"><button class="btn ghost" data-close>취소</button><button class="btn primary" id="chCreate">만들기</button></div>`);
  const go = async () => {
    const name = $('chName').value.trim().slice(0, 30);
    if (!name) return toast('채널 이름을 입력하세요');
    const ref = await db.collection('servers').doc(state.serverId).collection('channels').add({ name, createdAt: TS() });
    closeModal(); openChannel(ref.id);
  };
  $('chCreate').onclick = go;
  $('chName').onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) go(); };
}
function openChannel(cid) {
  state.channelId = cid; renderSide();
  const c = channels.find(x => x.id === cid) || { name: '' };
  $('mainHead').innerHTML = `<h2>${esc(c.name)}</h2><span class="sub">${esc(curServer()?.name || '')}</span>`;
  listenMessages(db.collection('servers').doc(state.serverId).collection('channels').doc(cid).collection('messages'),
    `<div class="welcome"><h3>${esc(c.name)} 채널이 열렸어요</h3><p>첫 메시지를 남겨보세요.</p></div>`);
  showComposer(`${c.name}에 메시지 보내기`);
}

/* ---------- 5. 실시간 메시지 ---------- */
let welcomeHTML = '';
function listenMessages(ref, welcome) {
  if (msgUnsub) msgUnsub();
  msgRef = ref; msgs = []; welcomeHTML = welcome; forceScroll = true;
  $('mainBody').innerHTML = '<div class="messages" id="msgs"></div>';
  msgUnsub = ref.orderBy('createdAt').limitToLast(200).onSnapshot(s => {
    if (msgRef !== ref) return;
    msgs = s.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
    renderMessages();
  }, err => toast('메시지를 불러오지 못했어요: ' + err.message));
}
function renderMessages() {
  const box = $('msgs'); if (!box) return;
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  const items = msgs.map(m => ({ ...m, t: m.createdAt?.toDate?.() || new Date() }));
  items.forEach((m, i) => {
    const p = items[i - 1];
    m.newDay = !p || p.t.toDateString() !== m.t.toDateString();
    m.first = m.newDay || p.uid !== m.uid || (m.t - p.t) > 5 * 60 * 1000;
  });
  let html = welcomeHTML;
  items.forEach((m, i) => {
    const n = items[i + 1];
    const last = !n || n.first;
    const mine = m.uid === me.uid;
    if (m.newDay) html += `<div class="day">${fmtDay(m.t)}</div>`;
    const time = last ? `<time>${fmtTime(m.t)}</time>` : '';
    if (mine) {
      html += `<div class="m mine ${m.first ? 'first' : ''}"><div class="bubble">${fmtText(m.text)}</div>${time}</div>`;
    } else {
      const p = getUser(m.uid);
      html += `<div class="m other ${m.first ? 'first' : ''}"><div class="av-slot">${m.first ? av(p, 34) : ''}</div>
        <div class="m-col">${m.first ? `<span class="m-name" style="color:${safeColor(p.color)}">${esc(p.nickname)}</span>` : ''}<div class="bubble">${fmtText(m.text)}</div></div>${time}</div>`;
    }
  });
  box.innerHTML = html;
  if (forceScroll || nearBottom) { box.scrollTop = box.scrollHeight; forceScroll = false; }
}
const input = $('msgInput');
function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; }
input.oninput = autoGrow;
input.onkeydown = e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); sendMessage(); }
};
$('sendBtn').onclick = () => sendMessage();
async function sendMessage() {
  const text = input.value.trim(); if (!text || !msgRef) return;
  if (text.length > 2000) return toast('메시지는 2000자까지 보낼 수 있어요');
  input.value = ''; autoGrow(); forceScroll = true; input.focus();
  try {
    await msgRef.add({ uid: me.uid, text, createdAt: TS() });
    if (state.view === 'dm') db.collection('dms').doc(state.dmId).set({ lastAt: TS() }, { merge: true });
  } catch (e) { toast('보내지 못했어요: ' + e.message); input.value = text; }
}

/* ---------- 6. 친구 & DM ---------- */
function openFriends() {
  stopView();
  state = { view: 'friends', serverId: null, channelId: null, dmId: null };
  renderTabs(); renderSide(); showComposer(null);
  $('mainHead').innerHTML = `<h2>친구</h2>`;
  renderFriends();
}
function renderFriends() {
  if (state.view !== 'friends' || !myProfile) return;
  const friends = myProfile.friends || [];
  const typed = $('friendCodeIn')?.value || '';
  $('mainBody').innerHTML = `<div class="friends">
    <section class="card"><h3>내 친구 코드</h3>
      <div class="row" style="align-items:center;justify-content:space-between"><span class="code">${esc(myProfile.friendCode)}</span><button class="btn small" data-copycode>복사</button></div>
      <p class="muted small" style="margin-top:10px">이 코드를 친구에게 알려주면 나를 추가할 수 있어요.</p>
    </section>
    <section class="card"><h3>친구 추가</h3>
      <div class="row"><input id="friendCodeIn" maxlength="6" placeholder="친구 코드 6자리" value="${esc(typed)}" aria-label="친구 코드"><button class="btn primary" data-sendreq>요청 보내기</button></div>
    </section>
    ${requests.length ? `<section class="card wide"><h3>받은 요청 ${requests.length}개</h3>${requests.map(r => { const p = getUser(r.from); return `
      <div class="friend-row">${av(p, 40)}<div class="fr-info"><b>${esc(p.nickname)}</b><span class="muted">${esc(p.status || '')}</span></div>
      <button class="btn small mint" data-accept="${r.id}">수락</button><button class="btn small" data-decline="${r.id}">거절</button></div>`; }).join('')}</section>` : ''}
    <section class="card wide"><h3>친구 ${friends.length}명</h3>${friends.length ? friends.map(uid => { const p = getUser(uid); return `
      <div class="friend-row">${av(p, 40)}<div class="fr-info"><b>${esc(p.nickname)}</b><span class="muted">${esc(p.status || '')}</span></div>
      <button class="btn small primary" data-dmuser="${uid}">대화하기</button><button class="btn small ghost" data-unfriend="${uid}">삭제</button></div>`; }).join('')
      : '<p class="muted">아직 친구가 없어요. 친구 코드를 주고받아 보세요.</p>'}</section>
  </div>`;
  $('friendCodeIn').onkeydown = e => { if (e.key === 'Enter') sendFriendRequest(); };
}
$('mainBody').onclick = e => {
  const t = e.target.closest('[data-copycode],[data-sendreq],[data-accept],[data-decline],[data-dmuser],[data-unfriend]'); if (!t) return;
  const d = t.dataset;
  if (d.copycode !== undefined) { navigator.clipboard.writeText(myProfile.friendCode); toast('친구 코드를 복사했어요'); }
  else if (d.sendreq !== undefined) sendFriendRequest();
  else if (d.accept) acceptRequest(d.accept);
  else if (d.decline) db.collection('friendRequests').doc(d.decline).delete();
  else if (d.dmuser) openDMWith(d.dmuser);
  else if (d.unfriend) unfriend(d.unfriend);
};
async function sendFriendRequest() {
  const code = $('friendCodeIn').value.trim().toUpperCase();
  if (code.length !== 6) return toast('친구 코드는 6자리예요');
  if (code === myProfile.friendCode) return toast('내 코드는 추가할 수 없어요');
  try {
    const q = await db.collection('users').where('friendCode', '==', code).limit(1).get();
    if (q.empty) return toast('이 코드의 사용자를 찾을 수 없어요');
    const to = q.docs[0].id;
    if ((myProfile.friends || []).includes(to)) return toast('이미 친구예요');
    const reverse = requests.find(r => r.from === to);
    if (reverse) return acceptRequest(reverse.id);
    await db.collection('friendRequests').doc(`${me.uid}_${to}`).set({ from: me.uid, to, createdAt: TS() });
    $('friendCodeIn').value = ''; toast('친구 요청을 보냈어요');
  } catch (e) { toast('요청을 보내지 못했어요: ' + e.message); }
}
async function acceptRequest(id) {
  const r = requests.find(x => x.id === id); if (!r) return;
  const b = db.batch();
  b.update(db.collection('users').doc(me.uid), { friends: FV.arrayUnion(r.from) });
  b.update(db.collection('users').doc(r.from), { friends: FV.arrayUnion(me.uid) });
  b.delete(db.collection('friendRequests').doc(id));
  await b.commit(); toast('친구가 되었어요');
}
async function unfriend(uid) {
  if (!confirm(`${getUser(uid).nickname}님을 친구에서 삭제할까요?`)) return;
  const b = db.batch();
  b.update(db.collection('users').doc(me.uid), { friends: FV.arrayRemove(uid) });
  b.update(db.collection('users').doc(uid), { friends: FV.arrayRemove(me.uid) });
  await b.commit();
}
async function openDMWith(uid) {
  const members = [me.uid, uid].sort(); const id = members.join('_');
  await db.collection('dms').doc(id).set({ members }, { merge: true });
  openDM(id);
}
function dmOther(id) { return id.split('_').find(u => u !== me.uid) || me.uid; }
function renderDMHead() {
  const p = getUser(dmOther(state.dmId));
  $('mainHead').innerHTML = `${av(p, 36)}<h2>${esc(p.nickname)}</h2>${p.status ? `<span class="sub">${esc(p.status)}</span>` : ''}`;
}
function openDM(id) {
  stopView();
  state = { view: 'dm', serverId: null, channelId: null, dmId: id };
  renderTabs(); renderSide(); renderDMHead();
  const p = getUser(dmOther(id));
  listenMessages(db.collection('dms').doc(id).collection('messages'),
    `<div class="welcome">${av(p, 64)}<h3>${esc(p.nickname)}</h3><p>둘만의 대화가 여기서 시작돼요.</p></div>`);
  showComposer(`${p.nickname}에게 메시지 보내기`);
}

/* ---------- 2. 프로필 & 닉네임 ---------- */
function profileModal() {
  const p = myProfile; let color = safeColor(p.color);
  const preview = () => ({ nickname: $('setNick').value || '?', color, photoURL: $('setPhoto').value.trim() });
  modal(`<h2>프로필 편집</h2>
    <div class="profile-preview" id="pp">${av(p, 80)}</div>
    <label for="setNick">닉네임</label><input id="setNick" maxlength="20" value="${esc(p.nickname)}">
    <label for="setStatus">상태 메시지</label><input id="setStatus" maxlength="60" value="${esc(p.status || '')}" placeholder="지금 뭐 하고 있어요?">
    <label>프로필 색</label><div class="swatches">${COLORS.map(c => `<button class="sw ${c === color ? 'on' : ''}" data-color="${c}" style="background:${c}" aria-label="색 ${c}"></button>`).join('')}</div>
    <label for="setPhoto">프로필 사진 주소 (선택)</label><input id="setPhoto" value="${esc(p.photoURL || '')}" placeholder="https://로 시작하는 이미지 주소">
    <p class="muted small" style="margin-top:14px">아이디 ${esc(idOf(me.email))}</p>
    <div class="modal-foot"><button class="btn ghost" data-close>취소</button><button class="btn primary" id="saveProfile">저장</button></div>`);
  const upd = () => { $('pp').innerHTML = av(preview(), 80); };
  $('setNick').oninput = upd; $('setPhoto').oninput = upd;
  $('modal').querySelector('.swatches').onclick = e => {
    const b = e.target.closest('[data-color]'); if (!b) return;
    color = b.dataset.color;
    document.querySelectorAll('.sw').forEach(x => x.classList.toggle('on', x === b)); upd();
  };
  $('saveProfile').onclick = async () => {
    const nickname = $('setNick').value.trim(), photo = $('setPhoto').value.trim();
    if (!nickname) return toast('닉네임을 입력하세요');
    if (photo && !safeUrl(photo)) return toast('사진 주소는 https://로 시작해야 해요');
    await db.collection('users').doc(me.uid).update({ nickname, status: $('setStatus').value.trim(), color, photoURL: photo });
    closeModal(); toast('프로필을 저장했어요');
    rerenderSoon();
  };
}

/* ---------- 모달 ---------- */
function modal(html) {
  $('modal').innerHTML = html; $('modalBg').classList.remove('hidden');
  const f = $('modal').querySelector('input'); if (f) setTimeout(() => f.focus(), 30);
}
function closeModal() { $('modalBg').classList.add('hidden'); }
$('modalBg').onclick = e => { if (e.target.id === 'modalBg' || e.target.closest('[data-close]')) closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('menu').classList.add('hidden'); } });
</script>
